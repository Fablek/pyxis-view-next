services:
  view:
    build: .
    container_name: pyxis-view-next
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - INTERNAL_API_URL=http://pyxis-admin:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - pyxis-network

networks:
  pyxis-network:
    external: true